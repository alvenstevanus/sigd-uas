<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web GIS PAUD, TK & Daycare Pontianak Utara — Kelompok 14</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  
  <!-- Leaflet.draw CSS CDN (cdnjs) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- App Custom CSS -->
  <link rel="stylesheet" href="/css/style.css?v=2" />
</head>
<body>

  <!-- Fullscreen Leaflet Map -->
  <div id="map"></div>

  <!-- Floating Control & Filter Panel -->
  <div class="floating-panel">
    <!-- Header -->
    <div class="panel-header">
      <span class="panel-tag"><i class="fas fa-layer-group"></i> SK-4 Leaflet JS</span>
      <h1 class="panel-title">PAUD & TK Pontianak Utara</h1>
      <p class="panel-subtitle">Sistem Informasi Geografis — Kelompok 14</p>
      <button id="btn-toggle-panel" class="panel-toggle-btn" title="Kecilkan/Buka Panel">
        <i class="fas fa-chevron-up"></i>
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="panel-body">
      <!-- Stat Counter Card -->
      <div class="stat-banner">
        <div class="stat-item">
          <span class="stat-num" id="stat-active">0</span>
          <span class="stat-label">Titik Tampil</span>
        </div>
        <div style="border-left: 1px solid #cbd5e1; height: 28px;"></div>
        <div class="stat-item">
          <span class="stat-num" style="color: #64748b;" id="stat-total">32</span>
          <span class="stat-label">Total Fasilitas</span>
        </div>
      </div>

      <!-- Mode Display Switch (Clustering & Polygon Zona) -->
      <div class="filter-group">
        <div class="filter-group-title">
          <span><i class="fas fa-sliders-h"></i> Opsi Visualisasi</span>
        </div>
        
        <div class="switch-item">
          <div class="switch-label-wrap">
            <span class="switch-title">Clustering Titik</span>
            <span class="switch-desc">L.markerClusterGroup()</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-cluster">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-item">
          <div class="switch-label-wrap">
            <span class="switch-title">Poligon Zona</span>
            <span class="switch-desc">Zona Pendidikan Anak</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-zona" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Filter Kategori Jenjang -->
      <div class="filter-group">
        <div class="filter-group-title">
          <span><i class="fas fa-graduation-cap"></i> Filter Jenjang</span>
        </div>
        <div class="filter-options">
          <label class="filter-checkbox">
            <div class="checkbox-label-wrap">
              <input type="checkbox" id="filter-tk" checked>
              <span class="color-dot tk"></span>
              <span>TK (Taman Kanak)</span>
            </div>
            <span class="badge-count" id="count-tk">0</span>
          </label>

          <label class="filter-checkbox">
            <div class="checkbox-label-wrap">
              <input type="checkbox" id="filter-paud" checked>
              <span class="color-dot paud"></span>
              <span>PAUD (Usia Dini)</span>
            </div>
            <span class="badge-count" id="count-paud">0</span>
          </label>

          <label class="filter-checkbox">
            <div class="checkbox-label-wrap">
              <input type="checkbox" id="filter-daycare" checked>
              <span class="color-dot daycare"></span>
              <span>Daycare (Penitipan)</span>
            </div>
            <span class="badge-count" id="count-daycare">0</span>
          </label>
        </div>
      </div>

      <!-- Filter Kategori Akreditasi -->
      <div class="filter-group">
        <div class="filter-group-title">
          <span><i class="fas fa-award"></i> Filter Akreditasi</span>
        </div>
        <div class="filter-options horizontal">
          <label class="filter-checkbox">
            <div class="checkbox-label-wrap">
              <input type="checkbox" id="filter-akr-a" checked>
              <span>A</span>
            </div>
          </label>
          <label class="filter-checkbox">
            <div class="checkbox-label-wrap">
              <input type="checkbox" id="filter-akr-b" checked>
              <span>B</span>
            </div>
          </label>
          <label class="filter-checkbox">
            <div class="checkbox-label-wrap">
              <input type="checkbox" id="filter-akr-c" checked>
              <span>C</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="panel-actions">
        <button id="btn-reset-filter" class="btn btn-outline">
          <i class="fas fa-rotate-left"></i> Reset Filter
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="panel-footer">
      <i class="fas fa-university"></i> PjBL SIG Dasar &copy; 2026 — Kelompok 14
    </div>
  </div>

  <!-- Leaflet JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Leaflet MarkerCluster JS CDN -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Leaflet.draw JS CDN (cdnjs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- App JS -->
  <script src="/js/app.js?v=3"></script>
</body>
</html>
